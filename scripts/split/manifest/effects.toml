# Split manifest for machines/effects.py (P0-T07), drafted against engine main
# 92c43981. Format: scripts/split/manifest_lib.py.
#
# targets IS the FAMILIES order F2 uses for intra-segment order; it is the
# design's order unchanged.
#
# How a def is placed (first hit wins, see manifest_lib "Resolution precedence"):
# 1. [names]: the four ladders -> dispatch; EFFECTS, TRIGGER_EFFECTS,
#    ACTIVATED_EFFECTS and the three *_effect_for -> registries; hub helpers ->
#    _common (below).
# 2. classes -> _common (the 19 classes: notices and private records).
# 3. `_merge_*` pair parsers -> merges; stream-named sub-ladders
#    (`_r0a_t5_ability_effect` ...) and the generic clause readers (inline regex
#    ladders parse_clause_effect/_parse_targeted_clause and the parse_*_effect
#    entry points) -> dispatch.
# 4. One "first mechanic word" rule per family: a def goes to the family owning
#    the FIRST mechanic word in its name (`_parse_each_opponent_loses_life_...`
#    -> life, `_parse_exile_then_return_...` -> removal). Each pattern skips
#    leading words that are not in any family's word list, then requires its
#    own word; the skip list is the union of every family's words, so the rules
#    are mutually exclusive by position and a new parser lands in its family
#    without a manifest edit.
# 5. Weak words matched anywhere, only when no mechanic word is present:
#    modal (may, optional, unless, if, condition(al), instead, delayed, pile(s)),
#    draw_discard (hand), continuous (double(s)).
# 6. [placed] (bake): the rest by caller majority, then callee majority.
# Constants: manifest_lib's constant rule (only user's family; shared -> _common).
#
# Hubs: a def that no family word claims (bake or weak-word placed) and that is
# referenced from 4+ other targets goes to _common; the list below was computed
# to a fixed point at 92c43981. Family-named helpers used everywhere
# (count_expression, _strip_non_effect_preamble ...) stay in their family as
# the design lists them.
#
# Lines vs the design's first-pass estimates (more than 50% off):
# - text 2.7k vs 6.6k: the first pass counted referent/antecedent parsers as
#   text; here a parser goes to the family of its first mechanic word
#   (`_parse_exile_until_antecedent` -> removal), text keeps the splitters,
#   normalisers and referent readers.
# - amounts 2.7k vs 1.5k: the for-each multipliers, devotion/converge and
#   "equal to" readers lead with a count word.
# - removal 6.7k vs ~4k: exile-then-play permissions, sacrifice-of-choice and
#   counterspell readers lead with exile/sacrifice/counter.
# - continuous 7.4k vs 4.6k: tap/untap, attach, goad, transform, grant and
#   emblem readers have no family of their own in the design.
# - modal 4.2k vs 0.9k: the conditional/instead/delayed/reflexive branch
#   readers (weak words) join may/choose/mode.
# - dispatch 6.6k vs ~1.5k: ~1.5k is the post-F2 size; F1 moves the four
#   ladders verbatim (4.2k) plus the inline regex ladders and entry points.
module = "magic_cards_model.machines.effects"
source = "src/magic_cards_model/machines/effects.py"
package = "src/magic_cards_model/machines/effects"
mode = "module"
targets = [
  "_common", "text", "amounts", "removal", "returns", "library", "continuous", "counters",
  "tokens", "damage", "draw_discard", "search", "life", "control_copy", "modal", "mana",
  "merges", "registries", "dispatch",
]

[names]
_ability_effect_or_notice = "dispatch"
_spell_effect_or_notice = "dispatch"
_parse_mixed_clauses = "dispatch"
_parse_mixed_clause = "dispatch"
EFFECTS = "registries"
TRIGGER_EFFECTS = "registries"
ACTIVATED_EFFECTS = "registries"
effect_for = "registries"
trigger_effect_for = "registries"
activated_effect_for = "registries"
# hubs: referenced from 4+ other targets, claimed by no family word
_card_description_is_readable = "_common"
_effect_condition_is_readable = "_common"
_nonland_or_typed_card_matcher = "_common"
_opponents = "_common"
_parse_card_group_qualifier = "_common"
_parse_delayed_timing_clause = "_common"
_parse_mass_type_qualifier = "_common"
_permanent_id_and_name = "_common"
_players_in_apnap_order = "_common"
_prepare_effect_clauses = "_common"
_quality_matcher = "_common"
_targets_understood = "_common"
computed_permanents = "_common"
pay_consequence_effect = "_common"
[[rules]]  # every class (the notices and the private records) is shared
pattern = '.*'
target = "_common"
kinds = ["class"]

[[rules]]  # the multi-clause pair parsers
pattern = '_merge_.*'
target = "merges"
kinds = ["def"]

[[rules]]  # stream-named sub-ladders (_r0a_t5_ability_effect ...)
pattern = '_[a-z]\d+[a-z]?_t\d+_(?:ability|spell)_effect'
target = "dispatch"
kinds = ["def"]

[[rules]]  # the generic clause readers: inline regex ladders and their entry points
pattern = '_?parse_(?:targeted|player|mixed|clause)_(?:effect|clauses?)(?:_for_spell)?'
target = "dispatch"
kinds = ["def"]

