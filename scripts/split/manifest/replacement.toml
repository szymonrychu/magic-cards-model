# Split manifest for machines/replacement.py (P0-T07), drafted against engine main
# 92c43981.
# model: the replacement data (and the CreatedReplacementSpec union whole) plus
# the application that walks it; parse: the oracle-text readers;
# enters: the "enters the battlefield" replacements.
module = "magic_cards_model.machines.replacement"
source = "src/magic_cards_model/machines/replacement.py"
package = "src/magic_cards_model/machines/replacement"
mode = "module"
targets = ["model", "parse", "enters"]

[names]
CreatedReplacementSpec = "model"
# evaluated at import against the model's own classes
ENTERS_KINDS = "model"
Applies = "model"
Apply = "model"
# the card-name-keyed registry: read only by the text readers
REPLACEMENTS = "parse"
# choosing and applying among applicable replacements
applicable_effects = "model"
order_effects = "model"
choose_effect = "model"
apply_replacements = "model"

[[rules]]  # every class: the persisted model and the union members
pattern = '.*'
target = "model"
kinds = ["class"]

[[rules]]  # enters-the-battlefield replacements and the entering-counter keywords
pattern = '_?(?:[a-z0-9]+_)*(?:enter|enters|entering|tapped|untapped|riot|tribute|sunburst|compleated|bloodthirst|vanishing|impending|foretold)(?:_[a-z0-9_]*)?'
target = "enters"
kinds = ["def"]

[[rules]]  # oracle-text readers
pattern = '_?(?:try|compile|read|reads|parse|parsed|strip|split|expand)_[a-z0-9_]*|[a-z0-9_]*_(?:line|lines)'
target = "parse"
kinds = ["def"]

