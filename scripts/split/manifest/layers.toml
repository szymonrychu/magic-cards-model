# Split manifest for machines/layers.py (P0-T07), drafted against engine main
# 92c43981. model: every persisted class and the four discriminated unions
# (Count, Selector, Modification, Condition) whole with their member classes
# and constructors; parse: the oracle-text readers (builders, sentence
# parsers); apply: layer application (ContinuousEffects, LayerContext,
# compute_board); registry: LAYER_EFFECTS and the lookups that read it.
module = "magic_cards_model.machines.layers"
source = "src/magic_cards_model/machines/layers.py"
package = "src/magic_cards_model/machines/layers"
mode = "module"
targets = ["model", "parse", "apply", "registry"]

[names]
# layer application: the layer system and its context
ContinuousEffects = "apply"
LayerContext = "apply"
ComputedBoard = "apply"
Journal = "apply"
NotOnBoard = "apply"
compute_board = "apply"
# the discriminated-union aliases stay with their member classes
Count = "model"
Selector = "model"
Modification = "model"
Condition = "model"
# shared by model and the readers: the layer order tables, the board alias and
# a sentence the model's own defaults read, all evaluated at class creation
_SUBLAYERS_BY_LAYER = "model"
_SUBLAYERED = "model"
Board = "model"
DOESNT_UNTAP_TEXT = "model"
# a model class body calls it at class creation
_split_and_validate_keywords = "model"
# a builder's signature names LayerContext, so it lives beside it
EffectBuilder = "apply"
# the card-name-keyed registry and the lookups that read it
LAYER_EFFECTS = "registry"
effects_for = "registry"
static_effects = "registry"

[[rules]]  # every other class: the persisted model and its discriminated unions
pattern = '.*'
target = "model"
kinds = ["class"]

[[rules]]  # lowercase module-level instances are prebuilt union members
pattern = '[a-z][a-z0-9_]*'
target = "model"
kinds = ["const"]

[[rules]]  # constructors of the union members (selectors, modifications, counts)
pattern = '(?:_?only|only_this_incarnation|same_name_as|qualified_creatures|self_if_[a-z_]+|(?:all_|other_)?(?:creatures|permanents|lands|transformed_permanents|other_creatures|other_transformed_permanents)_controlled_by[a-z_]*|other_non_aura_enchantments|grant_ability(?:_instance)?|add_(?:type|subtype)|set_[a-z_]+|replace_text|define_[a-z_]+|modify_[a-z_]+|count_[a-z_]+)'
target = "model"
kinds = ["def"]

[[rules]]  # oracle-text readers: builders, sentence parsers, shape tests
pattern = '_?(?:[a-z0-9]+_)*(?:builder|parse|parsed|sentence|sentences|line|lines|text|texts|words|clause|clauses|split|strip|normalize|looks|fold|retention|dispatch|gate|selector|subject)(?:_[a-z0-9_]*)?'
target = "parse"
kinds = ["def"]

