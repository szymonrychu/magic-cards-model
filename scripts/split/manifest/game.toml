# Split manifest for models/game.py (P0-T07), drafted against engine main
# 92c43981. Format: scripts/split/manifest_lib.py, class mode.
#
# Game's methods move to method-only mixins; `class Game(<mixins>, EngineModel)`
# stays in the package __init__ with:
# - stay: every field in source order (CURRENT_SCHEMA_VERSION is the ClassVar
#   field among them), the pydantic-decorated `_check_schema_version`, the
#   pydantic hook `model_post_init`, and `settle_pregame`, which calls the
#   module-level `ask_mulligan` that tests/scenarios/test_mulligans.py:618
#   monkeypatches on the game module. Fields and pydantic-decorated members
#   also stay automatically, so a new field cannot leak into a mixin.
# - records: every other module-level class (CastRecord, PreventionShield ...).
#
# Methods: [names] first, then the "first mechanic word" rules below (a method
# goes to the mixin owning the first mechanic word in its name; a few
# distinctive words - state_based, mulligan, on_stack, activation - are matched
# anywhere first), then [placed] (bake: caller majority, then callee majority).
#
# Lines vs the design's estimates (more than 50% off): the design's mixin sizes
# sum to 16.1k and leave the ~4.6k bake share out; every method lands in a mixin
# here (21.7k), so the larger mixins absorb it:
# - _stack_priority 3.3k vs 2.0k: targeting legality and the hexproof/shroud/
#   protection refusals (~1.1k) belong with the stack and resolution.
# - _turn_sba 2.1k vs 1.2k: the opening-hand/mulligan procedure and
#   game end join the turn structure and state-based actions.
# - _continuous 1.6k vs 1.0k: emblems, the Ring, counters on objects, control.
# - _conditions 1.7k vs 0.9k: the per-turn ledgers and last-known information
#   the conditions read.
# - _triggers_decisions 2.3k vs 0.9k: every player question (ask, may,
#   may_pay_*, choose_*) and event emission, not only triggers.
module = "magic_cards_model.models.game"
source = "src/magic_cards_model/models/game.py"
package = "src/magic_cards_model/models/game"
mode = "class"
class = "Game"
targets = [
  "_zones", "_activation", "_stack_priority", "_costs_mana", "_casting", "_turn_sba",
  "_continuous", "_conditions", "_damage_life", "_combat", "_triggers_decisions", "records",
]
