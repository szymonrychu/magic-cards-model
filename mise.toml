[tools]
python = "3.13"
uv = "latest"
# Pinned here rather than inherited from the workbench root: this repo is an
# independent GitHub repo and its own CI clones it alone, with no superrepo
# .mise.toml above it to supply ruff.
ruff = "0.15.20"

[env]
_.python.venv = { path = ".venv", create = true }
UV_PYTHON_DOWNLOADS = "never"

[tasks.install]
description = "Sync the virtualenv from the lockfile"
run = "uv sync --all-extras"

[tasks.lint]
description = "Lint and format check"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.fmt]
description = "Format and autofix"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.test]
description = "Run the test suite (all but the behavioural pool sweep)"
run = "uv run pytest --ignore=tests/test_behavioural_sweep.py"

# The behavioural pool sweep (`tests/test_behavioural_sweep.py`) executes
# every handled trigger and activation of every Modern/Pioneer/Standard card
# in the pool through the real engine - several minutes, so it is its own
# task rather than part of the quick `test`. `test:full` (everything, sweep
# included) is what the full-suite/merge flow runs before anything lands.
[tasks."test:behaviour"]
description = "Run the behavioural pool sweep: every handled trigger fires, every activation resolves"
run = "uv run pytest tests/test_behavioural_sweep.py"

[tasks."test:full"]
description = "Run the whole suite, behavioural pool sweep included (the merge gate)"
run = "uv run pytest"

# The S1 dispatch-chain winner fingerprint (engine-modularization plan) is
# gated in `tests/test_dispatch_fingerprint.py` against the committed
# `tests/dispatch_fingerprint_baseline.json`. This is the one documented way
# to regenerate that baseline - after a real split (S2-S5) that changes which
# parser wins on purpose, or after the pool/parsers move once this branch is
# merged behind the remaining Reality Fracture branches.
[tasks."dispatch:fingerprint"]
description = "Regenerate tests/dispatch_fingerprint_baseline.json"
run = "uv run python scripts/dispatch_fingerprint.py --write"

# The Dockerfiles live in ../magic-cards-model-api because this engine is a
# path dependency of it, so both images are built from there. These just
# delegate - do not duplicate the build logic here.
[tasks."docker:push"]
description = "Push both images to harbor (runs the real task in the api repo)"
run = "cd ../magic-cards-model-api && mise run docker:push"

[tasks.image-tag]
description = "Print the short git sha the image tasks would tag with"
run = "cd ../magic-cards-model-api && mise run image-tag"

# ---------------------------------------------------------------- rules --
# The Comprehensive Rules, straight from Wizards. `knowledge_search` is the
# fast path and stays the first stop, but it TRUNCATES long rules - CR 305.7
# came back cut at "and any" on every phrasing tried, and the cut-off tail
# ("Note that this doesn't remove any abilities that were granted to the land
# by other effects") was the sentence that settled the question. This is the
# fallback for exactly that: the primary source, on disk, greppable, whole.
#
# The download URL carries the release date and changes with every CR update,
# so the task scrapes the rules page for the current link rather than pinning
# one. The file is gitignored - it is Wizards' document, it is a megabyte, and
# it goes stale; re-pull it rather than committing it.
[tasks."rules:pull"]
description = "Download the current Comprehensive Rules txt to .rules/"
run = """
set -eu
mkdir -p .rules
URL="$(curl -sL https://magic.wizards.com/en/rules \
  | grep -oE 'https://media\\.wizards\\.com/[0-9]{4}/downloads/MagicCompRules[^"]*\\.txt' \
  | head -1)"
test -n "$URL" || { echo "could not find a CR txt link on magic.wizards.com/en/rules" >&2; exit 1; }
echo "pulling $URL"
# The href has a literal space in the filename; curl needs it percent-encoded.
curl -fsSL "${URL// /%20}" -o .rules/MagicCompRules.txt
# UTF-8 BOM and CRLF line endings come with the file. Left as they are so the
# bytes match what Wizards published; `rules:find` strips the CR for display.
head -3 .rules/MagicCompRules.txt | tr -d '\\r' | sed -n '3p'
echo "saved to .rules/MagicCompRules.txt ($(wc -c < .rules/MagicCompRules.txt | tr -d ' ') bytes)"
"""

[tasks."rules:find"]
description = "Print a rule and its subrules in full: mise run rules:find 305.7"
# A script rather than an inline body, so mise appends the rule number as an
# argument instead of the body having to reach for a positional it never gets.
run = "scripts/cr.sh"
