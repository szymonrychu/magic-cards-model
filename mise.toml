[tools]
python = "3.13"
uv = "latest"
# Pinned here rather than inherited from the workbench root: this repo is an
# independent GitHub repo and its own CI clones it alone, with no superrepo
# .mise.toml above it to supply ruff.
ruff = "0.15.20"

[env]
_.python.venv = { path = ".venv", create = true }
UV_PYTHON_DOWNLOADS = "never"

[tasks.install]
description = "Sync the virtualenv from the lockfile"
run = "uv sync --all-extras"

[tasks.lint]
description = "Lint and format check"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.fmt]
description = "Format and autofix"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.test]
description = "Run the test suite (all but the behavioural pool sweep)"
run = "uv run pytest --ignore=tests/test_behavioural_sweep.py -n 6"

# One CI shard of the quick suite (same scope as `test`: everything but the
# behavioural sweep). Files are split by scripts/ci_shard.py (balanced on
# tests/ci_weights.json); the workflow runs SHARD_COUNT of these in parallel.
# Locally: SHARD_INDEX=3 SHARD_COUNT=16 PYTEST_XDIST_N=6 mise run test:shard
[tasks."test:shard"]
description = "Run one CI shard of the quick suite: SHARD_INDEX=<0-based> SHARD_COUNT=<n> [PYTEST_XDIST_N=<workers>]"
run = 'uv run pytest -n "${PYTEST_XDIST_N:-auto}" $(python3 scripts/ci_shard.py "$SHARD_INDEX" "$SHARD_COUNT")'

[tasks."test:shard-check"]
description = "Check that the CI shards partition every test file exactly once: SHARD_COUNT=<n>"
run = 'python3 scripts/ci_shard.py --check "$SHARD_COUNT"'

# The behavioural pool sweep (`tests/test_behavioural_sweep.py`) executes
# every handled trigger and activation of every Modern/Pioneer/Standard card
# in the pool through the real engine - several minutes, so it is its own
# task rather than part of the quick `test`. `test:full` (everything, sweep
# included) is what the full-suite/merge flow runs before anything lands.
[tasks."test:behaviour"]
description = "Run the behavioural pool sweep: every handled trigger fires, every activation resolves"
run = "uv run pytest tests/test_behavioural_sweep.py -n 6"

[tasks."test:full"]
description = "Run the whole suite, behavioural pool sweep included (the merge gate)"
run = "uv run pytest -n 6"

# The sweep also compares what each executed ability did against its golden,
# `tests/golden/<card-slug>/<triggered|activated>-<n>.json` (see
# `tests/golden/__init__.py`). When a behaviour change is intended - a new
# card handled, a reader fixed - regenerate them here and review the golden
# diff in the commit. Never edit a golden by hand.
# Safe to parallelise: each executed case writes its own
# tests/golden/<card-slug>/<triggered|activated>-<n>.json path (unique per
# card+family+number - see `_check_golden`), so no two workers ever write the
# same file. The one non-parametrized cleanup test in this module,
# `test_every_golden_belongs_to_a_swept_case`, deletes goldens that exist on
# disk but aren't in the full expected set computed from the whole pool - that
# set doesn't depend on which worker has written what yet, so it's correct
# regardless of xdist's execution order relative to the write cases.
[tasks."golden:update"]
description = "Regenerate the behavioural sweep's golden files (tests/golden/) from the engine as it is now"
run = "uv run pytest tests/test_behavioural_sweep.py --update-golden -n 6"

[tasks."golden:replay"]
description = "Replay golden files as scenarios and print any difference: mise run golden:replay tests/golden/<card>/<ability>.json"
run = "uv run python -m tests.golden"

# The S1 dispatch-chain winner fingerprint (engine-modularization plan) is
# gated in `tests/test_dispatch_fingerprint.py` against the committed
# `tests/dispatch_fingerprint_baseline.json`. This is the one documented way
# to regenerate that baseline - after a real split (S2-S5) that changes which
# parser wins on purpose, or after the pool/parsers move once this branch is
# merged behind the remaining Reality Fracture branches.
[tasks."dispatch:fingerprint"]
description = "Regenerate tests/dispatch_fingerprint_baseline.json"
run = "uv run python scripts/dispatch_fingerprint.py --write"

# The Dockerfiles live in ../magic-cards-model-api because this engine is a
# path dependency of it, so both images are built from there. These just
# delegate - do not duplicate the build logic here.
[tasks."docker:push"]
description = "Push both images to harbor (runs the real task in the api repo)"
run = "cd ../magic-cards-model-api && mise run docker:push"

[tasks.image-tag]
description = "Print the short git sha the image tasks would tag with"
run = "cd ../magic-cards-model-api && mise run image-tag"

# ---------------------------------------------------------------- rules --
# The Comprehensive Rules, straight from Wizards. `knowledge_search` is the
# fast path and stays the first stop, but it TRUNCATES long rules - CR 305.7
# came back cut at "and any" on every phrasing tried, and the cut-off tail
# ("Note that this doesn't remove any abilities that were granted to the land
# by other effects") was the sentence that settled the question. This is the
# fallback for exactly that: the primary source, on disk, greppable, whole.
#
# The download URL carries the release date and changes with every CR update,
# so the task scrapes the rules page for the current link rather than pinning
# one. The file is gitignored - it is Wizards' document, it is a megabyte, and
# it goes stale; re-pull it rather than committing it.
[tasks."rules:pull"]
description = "Download the current Comprehensive Rules txt to .rules/"
run = """
set -eu
mkdir -p .rules
URL="$(curl -sL https://magic.wizards.com/en/rules \
  | grep -oE 'https://media\\.wizards\\.com/[0-9]{4}/downloads/MagicCompRules[^"]*\\.txt' \
  | head -1)"
test -n "$URL" || { echo "could not find a CR txt link on magic.wizards.com/en/rules" >&2; exit 1; }
echo "pulling $URL"
# The href has a literal space in the filename; curl needs it percent-encoded.
curl -fsSL "${URL// /%20}" -o .rules/MagicCompRules.txt
# UTF-8 BOM and CRLF line endings come with the file. Left as they are so the
# bytes match what Wizards published; `rules:find` strips the CR for display.
head -3 .rules/MagicCompRules.txt | tr -d '\\r' | sed -n '3p'
echo "saved to .rules/MagicCompRules.txt ($(wc -c < .rules/MagicCompRules.txt | tr -d ' ') bytes)"
"""

[tasks."rules:find"]
description = "Print a rule and its subrules in full: mise run rules:find 305.7"
# A script rather than an inline body, so mise appends the rule number as an
# argument instead of the body having to reach for a positional it never gets.
run = "scripts/cr.sh"

# --------------------------------------------------------------- regression --
# Owner-approved hardening against a fix silently touching a previously fixed
# card or a previously passing test. See scripts/regression_guard.py's own
# docstring for what each of the two checks does.
[tasks."regression:guard"]
description = "Protected-test report (+ --ratchet: card-status ratchet over the printings pool AND every Modern/Pioneer/Standard-legal oracle card, held to docs/card_coverage/support-baseline.json): mise run regression:guard -- --repo <path> --base <sha> [--ratchet] [--bulk <oracle-cards>]"
run = "uv run python scripts/regression_guard.py"

# The committed per-card floor the ratchet holds every target-format card to.
# A full `card_coverage.py` run rewrites it too; this writes just the file.
[tasks."coverage:baseline"]
description = "Regenerate docs/card_coverage/support-baseline.json (the regression guard's oracle-wide floor) from the cached oracle-cards bulk"
run = "uv run python scripts/card_coverage.py --baseline-only --workers 6"

# -------------------------------------------------------------- metagame --
# Round 0 of the card-coverage campaign: a 30-day competitive-metagame
# snapshot from spellslinger, written to docs/card_coverage/metagame.json.
[tasks."metagame:fetch"]
description = "Fetch the 30-day competitive metagame snapshot from spellslinger into docs/card_coverage/metagame.json"
run = "uv run python scripts/fetch_metagame.py"

# -------------------------------------------------------- ironsmith compare --
# Local, on-demand MCM vs ironsmith comparison (docs/ironsmith-compare.md). Never
# in CI. ironsmith is run only as separate, unmodified processes on the user's
# machine; extra arguments go after `--`.
[tasks."compare:ironsmith:doctor"]
description = "Check the ironsmith checkout (IRONSMITH_DIR, default ../ironsmith) against scripts/ironsmith_compare/pin.toml"
run = "uv run python -m scripts.ironsmith_compare doctor"

[tasks."compare:ironsmith:build"]
description = "Build ironsmith's two status binaries in its checkout"
run = "uv run python -m scripts.ironsmith_compare build"

[tasks."compare:ironsmith:collect"]
description = "Run ironsmith's status binaries on our Modern/Standard/Pioneer-legal cards"
run = "uv run python -m scripts.ironsmith_compare collect"

[tasks."compare:ironsmith"]
description = "Join MCM verdicts with the collected ironsmith data: report.md, report.json, worklist.csv under .ironsmith-compare/"
run = "uv run python -m scripts.ironsmith_compare compare"

# ----------------------------------------------------------------- split --
# The engine module split (docs/engine-module-split-design.md): a manifest-driven
# codemod lands each step as one script-made commit, and one gate command per
# tier proves it. Every task is a thin wrapper over a script in scripts/split/;
# extra arguments go after `--`. The dry run and the freeze run the same code.
#   split:step F1|F2|F3|F4a..F4e   codemod/registry step + ruff + one commit
#   split:gate cheap|full --baseline <json> --step <step>   the gates
[tasks."split:surface"]
description = "Freeze (--write) or check the old-path surface snapshots every split facade must keep: mise run split:surface -- [--write]"
run = "uv run python scripts/split/surface.py"

[tasks."split:manifest-check"]
description = "Check one split manifest (placement, eager cycles, empty targets): mise run split:manifest-check -- scripts/split/manifest/<module>.toml"
run = "uv run python scripts/split/manifest_lib.py check"

[tasks."split:codemod"]
description = "Split one module into a package from its manifest (--check: dry import, --out <dir>): mise run split:codemod -- scripts/split/manifest/<module>.toml"
run = "uv run python scripts/split/codemod.py"

[tasks."split:to-registry"]
description = "F2: convert the pure dispatch rungs of the effects package into registry chains: mise run split:to-registry -- <package_dir> --manifest <effects.toml> [--overlap <json>]"
run = "uv run python scripts/split/to_registry.py"

[tasks."split:overlap"]
description = "Count ambiguous rung pairs inside the dispatch segments over the fingerprint corpus: mise run split:overlap -- --out overlap.json"
run = "uv run python scripts/split/overlap.py"

[tasks."split:baselines"]
description = "Measure (measure --out <json> [--full]) or compare (compare <before> <after> --step <step>) the split baselines: mise run split:baselines -- measure --out before.json"
run = "uv run python scripts/split/baselines.py"

[tasks."split:step"]
description = "Run one split landing as one commit (codemod, ruff on the new package, 'Split-Step' trailer): mise run split:step -- [--dry-print] <F1|F2|F3|F4a|F4b|F4c|F4d|F4e>"
run = "bash scripts/split/run_step.sh"

[tasks."split:gate"]
description = "Cheap or full gate for one split step, one PASS/FAIL line per check: mise run split:gate -- cheap|full --baseline <json> --step <step>"
run = "bash scripts/split/gates.sh"

[tasks."split:port-branch"]
description = "Port an open branch across the split (merge pre-split main, re-run the codemod, merge post-split main): mise run split:port-branch -- <branch>"
run = "bash scripts/split/port_branch.sh"
